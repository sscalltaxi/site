<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark background -->
  <circle cx="32" cy="32" r="32" fill="#0D0D1A"/>

  <!-- Car cabin (roof) - smooth modern shape -->
  <path d="M16 36 Q18 25 24 23 L40 23 Q46 25 48 36 Z" fill="#FFB800"/>

  <!-- Car body -->
  <rect x="6" y="36" width="52" height="13" rx="3" fill="#FFB800"/>

  <!-- Front window (windshield) -->
  <path d="M19 36 Q20 27 24 25 L30 25 L30 36 Z" fill="#81D4FA" opacity="0.85"/>

  <!-- Rear window -->
  <path d="M34 25 L40 25 Q44 27 45 36 L34 36 Z" fill="#81D4FA" opacity="0.85"/>

  <!-- B-pillar between windows -->
  <rect x="31" y="24.5" width="2" height="11.5" fill="#FFB800"/>

  <!-- Roof sign - TAXI bar -->
  <rect x="23" y="18" width="18" height="6" rx="2.5" fill="#ffffff"/>
  <text x="32" y="23" text-anchor="middle" font-size="4" font-weight="900" fill="#0D0D1A" font-family="Arial Black, Arial, sans-serif" letter-spacing="0.3">TAXI</text>

  <!-- Headlight (glow) -->
  <ellipse cx="8" cy="41" rx="3.5" ry="2" fill="#FFF9C4"/>
  <ellipse cx="8" cy="41" rx="2" ry="1.2" fill="#fff"/>

  <!-- Tail light -->
  <ellipse cx="56" cy="41" rx="3.5" ry="2" fill="#FF5252"/>
  <ellipse cx="56" cy="41" rx="2" ry="1.2" fill="#FF1744"/>

  <!-- Front bumper -->
  <rect x="5" y="44" width="7" height="2" rx="1" fill="#e6a000"/>
  <!-- Rear bumper -->
  <rect x="52" y="44" width="7" height="2" rx="1" fill="#e6a000"/>

  <!-- Door line -->
  <line x1="32" y1="36" x2="32" y2="49" stroke="#cc8800" stroke-width="0.8"/>

  <!-- Wheel arches (shadow) -->
  <ellipse cx="17" cy="49.5" rx="8.5" ry="2" fill="#000" opacity="0.25"/>
  <ellipse cx="47" cy="49.5" rx="8.5" ry="2" fill="#000" opacity="0.25"/>

  <!-- Rear wheel -->
  <circle cx="17" cy="49" r="7" fill="#111"/>
  <circle cx="17" cy="49" r="4.5" fill="#222"/>
  <!-- Spokes -->
  <line x1="17" y1="44.5" x2="17" y2="53.5" stroke="#444" stroke-width="1.2"/>
  <line x1="12.5" y1="49" x2="21.5" y2="49" stroke="#444" stroke-width="1.2"/>
  <line x1="13.8" y1="45.8" x2="20.2" y2="52.2" stroke="#444" stroke-width="1"/>
  <line x1="20.2" y1="45.8" x2="13.8" y2="52.2" stroke="#444" stroke-width="1"/>
  <!-- Hub cap -->
  <circle cx="17" cy="49" r="2.2" fill="#FFB800"/>

  <!-- Front wheel -->
  <circle cx="47" cy="49" r="7" fill="#111"/>
  <circle cx="47" cy="49" r="4.5" fill="#222"/>
  <line x1="47" y1="44.5" x2="47" y2="53.5" stroke="#444" stroke-width="1.2"/>
  <line x1="42.5" y1="49" x2="51.5" y2="49" stroke="#444" stroke-width="1.2"/>
  <line x1="43.8" y1="45.8" x2="50.2" y2="52.2" stroke="#444" stroke-width="1"/>
  <line x1="50.2" y1="45.8" x2="43.8" y2="52.2" stroke="#444" stroke-width="1"/>
  <circle cx="47" cy="49" r="2.2" fill="#FFB800"/>

  <!-- SS badge at bottom -->
  <rect x="21" y="57" width="22" height="7" rx="3.5" fill="#FFB800"/>
  <text x="32" y="62.5" text-anchor="middle" font-size="5.5" font-weight="900" fill="#0D0D1A" font-family="Arial Black, Arial, sans-serif" letter-spacing="1">SS</text>
</svg>
